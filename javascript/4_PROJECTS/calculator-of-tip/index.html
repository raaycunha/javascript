<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gorjeta</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <script src="src/js/script.js" defer></script>
</head>
<body>
    <main class="main-container">
        <header class="header-container">
            <h1>Calculadora de Gorjeta</h1>
        </header>
        <section class="container-input">
            <div class="box-input">
                <label for="inValue">Valor da conta:</label>
                <input type="number" 
                name="value" 
                id="inValue"
                placeholder="Digite o valor da conta..."
                title="Digite o valor da conta"
                minlength="1"
                required step="0.01">
            </div>
            <div class="box-input">
                <label for="inService">Qualidade do serviço:</label>
                <select name="service" id="inService">
                    <option value="10">Excelente - 10%</option>
                    <option value="8" selected>Ótimo - 8%</option>
                    <option value="5">Bom - 5%</option>
                    <option value="2">Ruim - 2%</option>
                </select>
            </div>
        </section>
            <button id="btnCalculate">Calcular Gorjeta</button>
            <section class="container-resp">
                <div class="box-resp">
                    <span>Valor da gorjeta:</span>
                    <div class="card-tip"></div>
                </div>
                <div class="box-resp">
                    <span>Valor total:</span>
                    <div class="card-tip"></div>
                </div>
            </section>
    </main>
</body>
</html>
