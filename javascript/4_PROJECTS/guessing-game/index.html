<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <script src="src/js/script.js" defer></script>
</head>
<body>
    <h1>Jogo de Adivinhação</h1>
    <main class="main-container">
        <section class="game-menu">
            <label for="inDifficulty">Escolha a dificuldade:</label>
            <select name="difficulty" id="inDifficulty">
                <option disabled selected>Selecione</option>
                <option value="10">Fácil</option>
                <option value="7">Médio</option>
                <option value="5">Difícil</option>
            </select>
        </section>
        <section class="container-game">
            <label for="inGuess">Eu estou pensando em um número entre 1 e 100. Tente adivinhar qual é!</label>
            <div class="box-input">
                <input type="number" 
                name="guess" 
                id="inGuess"
                placeholder="Digite sua resposta aqui"
                title="Digite sua resposta aqui"
                minlength="1"
                required maxlength="100">
                <button id="btnSend">Enviar</button>
            </div>
            <div class="resp-try">
                <span class="tips"></span>
                <button id="btnRestart">Jogar novamente</button>
                <span>Tentativas restantes: <span id="tryScore"></span></span>
            </div>
        </section>
    </main>
</body>
</html>
